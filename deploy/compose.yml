# Proposed isolated deployment. Review and approve before applying on the server.
name: cbp-review2
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cbp-review2:${RELEASE_TAG:?set reviewed commit SHA}
    restart: unless-stopped
    env_file: /home/deployer/.config/cbp-review2/app.env
    environment:
      APP_MODE: production
      APP_ORIGIN: https://carbuilders.192.81.212.73.sslip.io
      APP_DATABASE: /data/studio.sqlite3
      HOME: /data
      STUDIO_LIVE_RELOAD: '0'
    volumes:
      - app-data:/data
    networks: [web]
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: hosting-web
      traefik.http.routers.cbp-review2.rule: Host(`carbuilders.192.81.212.73.sslip.io`)
      traefik.http.routers.cbp-review2.entrypoints: websecure
      traefik.http.routers.cbp-review2.service: cbp-review2
      traefik.http.services.cbp-review2.loadbalancer.server.port: '8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host':'carbuilders.192.81.212.73.sslip.io'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  web:
    external: true
    name: hosting-web
volumes:
  app-data:
